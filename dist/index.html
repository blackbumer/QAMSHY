<!doctype html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071b2f">
  <meta name="description" content="Қамшы тарихы мен мәдени мәнін танытатын 7–8 сыныпқа арналған қазақ тіліндегі интерактивті ойын.">
  <title>QAMSHY: Ұлы Даланың құпиясы</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23071b2f'/%3E%3Cpath d='M18 43c12 8 29 0 27-15-1-8-10-11-15-6-6 7 7 13 14 6' fill='none' stroke='%23f6bd52' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M16 42l-5 10' stroke='%23e85d3f' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#gameStage">Ойынға өту</a>

  <section id="intro" class="intro-screen" aria-labelledby="introTitle">
    <img class="intro-art" src="assets/qamshy-opening.png" alt="Ұлы Даладағы ескі сандық ішіндегі өрнекті қамшы">
    <div class="intro-shade"></div>
    <div class="intro-content">
      <div class="eyebrow"><span class="live-dot"></span> Тарихи adventure · puzzle · quest</div>
      <h1 id="introTitle"><span>QAMSHY</span><br>Ұлы Даланың құпиясы</h1>
      <blockquote>«Бұл жай ғана қамшы емес. Оның әрбір өрімінде — тарих, әрбір өрнегінде — мәдениет бар.»</blockquote>
      <div class="intro-actions">
        <button id="startBtn" class="primary-btn">Сандықты ашу</button>
        <button id="continueBtn" class="ghost-btn hidden">Жалғастыру</button>
      </div>
      <p class="intro-note">7–8 сыныпқа арналған танымдық ойын · 15–20 минут</p>
    </div>
  </section>

  <div id="gameApp" class="app hidden">
    <header class="topbar">
      <button class="brand" id="homeBtn" aria-label="Басты бетке оралу">
        <span class="brand-mark">Q</span>
        <span><strong>QAMSHY</strong><small>Ұлы Даланың құпиясы</small></span>
      </button>
      <div class="score-cluster">
        <div class="heritage-score" title="Ұлттық мұра ұпайы"><span class="coin">✦</span><span id="scoreValue">0</span><small>Мұра ұпайы</small></div>
        <button class="icon-btn" id="soundBtn" aria-pressed="true" title="Дыбысты өшіру">♪</button>
        <button class="icon-btn mobile-menu-btn" id="menuBtn" aria-label="Миссиялар мәзірі" aria-expanded="false">☰</button>
      </div>
    </header>

    <div class="game-layout">
      <aside class="sidebar" id="sidebar" aria-label="Миссиялар">
        <div class="journey-head">
          <span>Саяхат картасы</span>
          <strong id="journeyFraction">0 / 9</strong>
        </div>
        <div class="progress-track"><span id="progressBar"></span></div>
        <nav id="missionNav" class="mission-nav"></nav>
        <button id="archiveBtn" class="archive-btn"><span>⌁</span><span>Құпия архив<small id="archiveCount">0 дерек ашылды</small></span></button>
        <button id="achievementsBtn" class="archive-btn"><span>🏅</span><span>Жетістіктер<small id="achievementCount">0 марапат</small></span></button>
      </aside>

      <main id="gameStage" class="stage" tabindex="-1">
        <div class="stage-topline">
          <span id="missionKicker" class="mission-kicker"></span>
          <span id="missionReward" class="reward-chip"></span>
        </div>
        <section id="missionContent" class="mission-content" aria-live="polite"></section>
      </main>
    </div>
  </div>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-card">
      <button class="modal-close" data-close-modal aria-label="Жабу">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
